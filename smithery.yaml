startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      databaseUrl:
        type: string
        description: "PostgreSQL DSN or sqlite:///ignis.db for local mode"
        default: "sqlite:///ignis.db"
      youtubeApiKey:
        type: string
        description: "YouTube Data API v3 key"
        default: ""
      youtubeSearchDailyLimit:
        type: integer
        description: "Total daily search.list calls available to this installation"
        default: 100
      youtubeScheduledSearchDailyLimit:
        type: integer
        description: "Daily search.list ceiling for scheduled Track 1 work"
        default: 70
      youtubeOtherDailyUnitLimit:
        type: integer
        description: "Shared daily units for YouTube endpoints other than search.list"
        default: 10000
      defaultGeo:
        type: string
        description: "ISO country code (VN, US, JP, SG, GLOBAL)"
        default: "VN"
  commandFunction: |
    (config) => ({
      command: "python",
      args: ["-m", "ignis.interfaces.mcp.server"],
      env: {
        DATABASE_URL: config.databaseUrl || "sqlite:///ignis.db",
        YOUTUBE_API_KEY: config.youtubeApiKey || "",
        YOUTUBE_SEARCH_DAILY_LIMIT: String(config.youtubeSearchDailyLimit ?? 100),
        YOUTUBE_SCHEDULED_SEARCH_DAILY_LIMIT: String(config.youtubeScheduledSearchDailyLimit ?? 70),
        YOUTUBE_OTHER_DAILY_UNIT_LIMIT: String(config.youtubeOtherDailyUnitLimit ?? 10000),
        DEFAULT_GEO: config.defaultGeo || "VN"
      }
    })
