services:
  worker:
    build: .
    container_name: fn-ignis-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-900}
      DEFAULT_GEO: ${DEFAULT_GEO:-VN}
    command: ["python", "-m", "ignis.interfaces.cli.scheduler"]
