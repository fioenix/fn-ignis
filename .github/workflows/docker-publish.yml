name: Docker Publish to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fioenix/fn-ignis

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Provenance: the OIDC token signs the attestation, which is stored beside the image.
      attestations: write
      id-token: write

    steps:
      # `v*` also matches v0.6, v01.2.3 and vlatest, and metadata-action parses versions loosely,
      # so a malformed tag could still produce image tags. Refuse it before anything is pushed.
      - name: Require a SemVer release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$REF_TYPE" != "tag" || ! "$REF_NAME" =~ $semver ]]; then
            echo "::error::Docker Publish runs only for a SemVer release tag (vMAJOR.MINOR.PATCH); got $REF_TYPE '$REF_NAME'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require tag matches project version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          project_version="$(awk -F'"' '/^version = "[^"]+"$/ {print $2; exit}' pyproject.toml)"
          if [[ -z "$project_version" || "$REF_NAME" != "v${project_version}" ]]; then
            echo "::error::Release tag '$REF_NAME' does not match project version '${project_version:-unreadable}'"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A stable release gets X.Y.Z, X.Y and latest. A prerelease gets only its exact version:
          # metadata-action skips {{major}}.{{minor}} and withholds latest for it.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/fioenix/fn-ignis
            io.modelcontextprotocol.server.name=io.github.fioenix/fn-ignis

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
