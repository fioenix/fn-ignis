name: CI

on:
  push:
    branches: [ main, master, develop, "release/*", "hotfix/*" ]
  # Every pull request, whatever it targets. The previous filter listed only main, master and
  # develop, so a stacked pull request -- one based on another feature branch while that branch is
  # still in review -- received no checks at all and looked green because nothing had run.
  pull_request:
  workflow_dispatch:


jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        # Full history: a secret is usually added in an earlier commit of the branch and removed
        # in a later one, which a shallow clone cannot see.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # Pinned: `latest` means the rules that ran yesterday are not the rules running today, so a
        # build that goes red tells you nothing about what changed. --redact keeps a finding out of
        # the log, because a public build log is a worse place for a credential than the commit was.
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 git --no-banner --redact --exit-code 1

  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    env:
      IGNIS_TEST_POSTGRES_DSN: postgresql://postgres:ignis_test@localhost:5432/postgres
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ignis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      # The whole range pyproject.toml claims. Testing one version while requires-python says
      # >=3.11 means three different answers to "what does this support": the metadata, the
      # matrix, and whatever the maintainer happens to run. All four pass, verified before this
      # matrix was widened rather than after.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked installs the exact solution in the committed uv.lock and fails if that lock
      # disagrees with pyproject.toml. uv pip install re-resolved from the dependency ranges, so
      # CI could pass on versions no released checkout would ever reproduce.
      - name: Install locked dependencies
        run: |
          uv venv
          uv sync --locked --extra dev --extra browser

      - name: Run Ruff Linter
        run: |
          uv run ruff check src/ tests/

      - name: Run Test Suite with Coverage
        run: |
          uv run pytest tests/ -v --cov=ignis --cov-report=term-missing

      # SC-004 promises at least 85% coverage for the Repository, the RSS Plugin, the YouTube
      # Plugin and the Registry. The step above measures the whole package and prints it; this one
      # reads that same .coverage data restricted to the four things the criterion names, and exits
      # non-zero below the floor. Until 22/09/2026 the threshold was printed and never enforced, so
      # coverage could fall without any build going red.
      #
      # The scope lives in .coveragerc.sc004, which is the single reviewable statement of what
      # SC-004 covers; tests/unit/test_t022_coverage_gate.py pins it, pins the floor at 85, and
      # refuses an omit pattern that would hide production code inside the scope.
      #
      # This runs on the PostgreSQL service configured above, reached only through
      # IGNIS_TEST_POSTGRES_DSN. Without it the PostgreSQL adapter's tests skip, roughly a quarter
      # of the scope goes unexercised, and the gate fails -- correctly, because the promise is not
      # met by a run that never touched half the repository.
      - name: Enforce the SC-004 Coverage Floor
        run: |
          uv run coverage report --rcfile=.coveragerc.sc004

      - name: Verify Clean Packaging (uv build)
        run: |
          uv build

      # The clean-user journey -- bootstrap from a clean checkout, registration, stdio handshake,
      # 39-tool discovery, a real tool call -- runs inside the suite above as
      # tests/integration/test_clean_user_journey.py, against the source tree.
      #
      # This step covers what that cannot: the wheel. It installs the built artifact into its own
      # environment and completes an MCP session from it, so a packaging mistake that an editable
      # install hides -- a missing template, an unshipped SQL seed -- fails here rather than in a
      # user's first run. The previous step installed the source tree with `uv pip install -e` and
      # only imported the module, which proved neither packaging nor usability.
      - name: Verify the Built Wheel Serves a Real MCP Session
        run: |
          set -euo pipefail
          WHEEL="$(ls "${GITHUB_WORKSPACE}"/dist/*.whl | head -1)"
          echo "Testing wheel: ${WHEEL}"
          mkdir -p /tmp/wheel-test && cd /tmp/wheel-test
          uv venv
          uv pip install --python .venv/bin/python "${WHEEL}"
          printf 'DATABASE_URL=sqlite:///%s/wheel_smoke.db\nDEFAULT_GEO=VN\n' "$(pwd)" > wheel.env
          IGNIS_ENV_FILE="$(pwd)/wheel.env" .venv/bin/python "${GITHUB_WORKSPACE}/scripts/wheel_mcp_smoke.py"


