name: CI

on:
  push:
    branches: [ main, master, develop, "release/*", "hotfix/*" ]
  pull_request:
    branches: [ main, master, develop ]


jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      IGNIS_TEST_POSTGRES_DSN: postgresql://postgres:ignis_test@localhost:5432/postgres
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ignis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked installs the exact solution in the committed uv.lock and fails if that lock
      # disagrees with pyproject.toml. uv pip install re-resolved from the dependency ranges, so
      # CI could pass on versions no released checkout would ever reproduce.
      - name: Install locked dependencies
        run: |
          uv venv
          uv sync --locked --extra dev --extra browser

      - name: Run Ruff Linter
        run: |
          uv run ruff check src/ tests/

      - name: Run Test Suite with Coverage
        run: |
          uv run pytest tests/ -v --cov=ignis --cov-report=term-missing

      - name: Verify Clean Packaging (uv build)
        run: |
          uv build

      - name: Verify Quickstart Onboarding from Clean State
        run: |
          mkdir -p /tmp/clean-test && cd /tmp/clean-test
          uv venv
          . .venv/bin/activate
          uv pip install -e "${GITHUB_WORKSPACE}"
          DATABASE_URL="sqlite:///test_smoke.db" uv run python -c "from ignis.interfaces.mcp.server import mcp; print('FastMCP Server initialized successfully from clean install')"


