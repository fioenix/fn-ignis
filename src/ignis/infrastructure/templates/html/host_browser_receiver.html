<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ignis — Answer receiver</title></head>
<body>
<p>Answer sent to the relay; close this tab</p>
<script nonce="{{ nonce }}">
(() => {
  const fragment = location.hash.slice(1);
  history.replaceState(null, '', location.pathname);
  // At least 29 decoded bytes: 12-byte IV, 16-byte tag and nonempty ciphertext.
  if (fragment.length < 39 || fragment.length > 1000000 ||
      /[^A-Za-z0-9_-]/.test(fragment)) return;
  const channel = new BroadcastChannel({{ channel | safe }});
  channel.postMessage(fragment);
  channel.close();
})();
</script>
</body>
</html>
