<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FN-IGNIS Trend Graph</title>
  <!--
    The canvas renderer and the force layout are written inline so the export stays a single
    self-contained file. Only the FINOLABS webfonts are fetched, and they degrade to the
    system stack offline.
  -->
  {% include "_fino_theme.html" %}
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; font-family: var(--font-sans); }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    #toolbar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 12px 16px;
    }
    #toolbar .brand {
      font-family: var(--font-display); font-weight: 400; font-size: var(--text-lg);
      letter-spacing: var(--tracking-display); text-transform: uppercase;
      color: var(--color-foreground); line-height: 1;
    }
    #toolbar .brand::after {
      content: ""; display: block; height: 2px; margin-top: 3px; border-radius: 2px;
      background: var(--fn-gradient-iridescent-line);
    }
    #toolbar input, #toolbar select {
      font-family: var(--font-sans); font-size: var(--text-xs); padding: 7px 10px;
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background: var(--color-background); color: var(--color-foreground);
    }
    #toolbar input:focus-visible, #toolbar select:focus-visible, #toolbar button:focus-visible {
      outline: 2px solid var(--color-ring); outline-offset: 2px;
    }
    #toolbar input[type="range"] { padding: 0; width: 110px; accent-color: var(--color-fn-violet); }
    #toolbar label {
      font-size: var(--text-2xs); font-weight: var(--font-weight-bold); letter-spacing: var(--tracking-micro);
      color: var(--color-muted-foreground); display: flex; align-items: center; gap: 6px;
    }
    #toolbar button {
      font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--font-weight-semibold);
      padding: 7px 14px; cursor: pointer; border: 1px solid var(--color-border);
      border-radius: var(--radius-full); background: var(--color-background); color: var(--color-foreground);
      transition: border-color var(--duration-base) var(--ease-out), background var(--duration-base) var(--ease-out);
    }
    #toolbar button:hover { border-color: var(--color-fn-mint); background: var(--color-fn-mint-soft); }

    #details {
      position: fixed; top: 96px; right: 16px; width: 320px; max-height: calc(100vh - 128px);
      overflow-y: auto; padding: 18px; display: none;
    }
    #details h2 {
      margin: 0 0 6px; font-size: var(--text-base); line-height: 1.4;
      letter-spacing: var(--tracking-heading); font-weight: var(--font-weight-bold);
    }
    #details .full-title {
      font-size: var(--text-2xs); line-height: 1.55; color: var(--color-subtle-foreground);
      margin-bottom: 10px; padding-left: 9px; border-left: 2px solid var(--color-border-strong);
    }
    #details .meta {
      font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-mono);
      color: var(--color-muted-foreground); margin-bottom: 14px; font-variant-numeric: tabular-nums;
    }
    #details .summary { font-size: var(--text-xs); color: var(--color-muted-foreground); line-height: 1.6; margin-bottom: 16px; }
    #details .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: var(--text-2xs); }
    #details .bar-row .name { width: 74px; font-weight: var(--font-weight-bold); color: var(--color-muted-foreground); }
    #details .bar-row b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    #details .bar { height: 8px; border-radius: var(--radius-full); flex: 1; background: var(--color-muted); overflow: hidden; }
    #details .bar span { display: block; height: 100%; border-radius: var(--radius-full); }
    #details .close {
      position: absolute; top: 14px; right: 16px; border: 0; background: none;
      font-size: var(--text-lg); color: var(--color-subtle-foreground); cursor: pointer; line-height: 1;
    }

    #legend { position: fixed; bottom: 16px; left: 16px; padding: 14px 16px; font-size: var(--text-2xs); }
    #legend .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--color-muted-foreground); font-weight: var(--font-weight-medium); }
    #legend .dot { width: 10px; height: 10px; border-radius: var(--radius-full); flex-shrink: 0; }
    #legend .ring { width: 10px; height: 10px; border-radius: var(--radius-full); flex-shrink: 0; border: 3px solid; background: transparent; }
    #legend .title {
      font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow);
      color: var(--color-fn-mint-ink); font-size: var(--text-3xs);
    }
    #legend .title + .caption { color: var(--color-subtle-foreground); font-size: var(--text-3xs); margin-top: 2px; }

    #tooltip {
      position: fixed; pointer-events: none; display: none; z-index: 20;
      background: var(--color-ink-900); color: var(--color-ink-0);
      font-size: var(--text-2xs); font-weight: var(--font-weight-medium);
      padding: 7px 11px; border-radius: var(--radius-md); max-width: 280px; line-height: 1.45;
    }
    #tooltip b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    #hint {
      position: fixed; bottom: 18px; right: 18px; font-size: var(--text-2xs);
      color: var(--color-subtle-foreground); font-weight: var(--font-weight-medium);
    }
  </style>
</head>
<body class="product-mode">
  <div id="stage"><canvas id="graph"></canvas></div>

  <div id="toolbar" class="fn-card">
    <span class="brand">FN-IGNIS Graph</span>
    <span class="fn-chip fn-mono" id="geo-chip"></span>
    <span class="fn-chip fn-mono" id="count-chip"></span>
    <input id="search" type="search" placeholder="Search topic..." autocomplete="off">
    <select id="category-filter"><option value="">All categories</option></select>
    <select id="platform-filter"><option value="">All platforms</option></select>
    <select id="momentum-filter"><option value="">All momentum</option></select>
    <label>Min score <input id="score-filter" type="range" min="0" max="100" value="0" step="5"><b id="score-value">0</b></label>
    <label><input id="label-toggle" type="checkbox" checked> Labels</label>
    <button id="reset">Reset view</button>
  </div>

  <div id="details" class="fn-card">
    <button class="close" id="details-close" aria-label="Close">&times;</button>
    <h2 id="d-title"></h2>
    <div class="full-title" id="d-full-title"></div>
    <div class="meta" id="d-meta"></div>
    <div class="summary" id="d-summary"></div>
    <div id="d-platforms"></div>
  </div>

  <div id="legend" class="fn-card">
    <div id="legend-rows"></div>
  </div>

  <div id="tooltip"></div>
  <div id="hint">Scroll to zoom · drag to pan · hover a dot for the raw signal · click a node for detail</div>

  <script>
    const GRAPH = {{ graph | tojson }};

    // Colours are read from the FINOLABS tokens rather than hard-coded, so the artifact
    // follows the design system when it moves. Two encodings, deliberately kept apart:
    // the node fill is momentum (ordinal, cool to warm) and the ring is the platform mix,
    // which uses each platform's own brand colour so the legend is memorable.
    const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const PLATFORM_TOKENS = {
      google: "--color-platform-google",
      youtube: "--color-platform-youtube",
      tiktok: "--color-platform-tiktok",
      threads: "--color-platform-threads",
      reels: "--color-platform-reels",
    };
    const MOMENTUM_TOKENS = {
      declining: "--color-ink-300",
      steady: "--color-chart-3",
      surging: "--color-chart-2",
      breakout: "--color-chart-10",
    };
    const FALLBACK = token("--color-ink-400") || "#8B8BA6";
    const platformColor = (p) => token(PLATFORM_TOKENS[p] || "") || FALLBACK;
    const momentumColor = (m) => token(MOMENTUM_TOKENS[(m || "").toLowerCase()] || "") || FALLBACK;

    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");

    const nodes = GRAPH.nodes.map((n, i) => {
      const angle = (i / Math.max(1, GRAPH.nodes.length)) * Math.PI * 2;
      const spread = 200 + Math.sqrt(i) * 42;
      const total = Math.max(1, Object.values(n.platforms).reduce((sum, c) => sum + c, 0));
      return Object.assign({}, n, {
        x: Math.cos(angle) * spread,
        y: Math.sin(angle) * spread,
        vx: 0, vy: 0,
        r: 6 + Math.sqrt(Math.max(1, n.signal_count)) * 2.4 + n.score / 22,
        mix: Object.entries(n.platforms).sort((a, b) => b[1] - a[1]).map(([p, c]) => [p, c / total]),
        visible: true,
      });
    });
    const nodeById = new Map(nodes.map((n) => [n.id, n]));
    const edges = GRAPH.edges
      .map((e) => ({ source: nodeById.get(e.source), target: nodeById.get(e.target), weight: e.weight }))
      .filter((e) => e.source && e.target);

    const neighbours = new Map(nodes.map((n) => [n.id, new Set()]));
    edges.forEach((e) => {
      neighbours.get(e.source.id).add(e.target.id);
      neighbours.get(e.target.id).add(e.source.id);
    });

    // A topic's prominence: how many signals carry it, how entangled it is with other topics, and
    // its momentum score. Type size and label priority both read this, so a hub topic reads as a
    // hub rather than every label shouting at the same volume.
    nodes.forEach((n) => {
      const degree = neighbours.get(n.id).size;
      n.degree = degree;
      n.prominence = Math.log1p(n.signal_count) / Math.log(40)
        + Math.log1p(degree) / Math.log(12) * 0.7
        + (n.score / 100) * 0.5;
    });
    const maxProminence = Math.max(0.001, ...nodes.map((n) => n.prominence));

    let scale = 0.9, offsetX = 0, offsetY = 0;
    let hovered = null, hoveredDot = null, selected = null, dragging = null, panning = false;
    let alpha = 1;
    let pointer = { x: 0, y: 0 };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", () => { resize(); draw(); });

    const toWorld = (sx, sy) => ({
      x: (sx - canvas.clientWidth / 2 - offsetX) / scale,
      y: (sy - canvas.clientHeight / 2 - offsetY) / scale,
    });

    // --- Force layout: repulsion + link springs + centering, cheap enough for a few hundred nodes.
    function tick() {
      if (alpha < 0.005) return false;
      alpha *= 0.985;

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let dist2 = dx * dx + dy * dy;
          if (dist2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dist2 = 1; }
          const minDist = (a.r + b.r + 26);
          const force = (2600 + minDist * 18) / dist2;
          const dist = Math.sqrt(dist2);
          const fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }

      edges.forEach((e) => {
        const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        const dist = Math.max(1, Math.hypot(dx, dy));
        const target = 120 - e.weight * 55;
        const k = (dist - target) * 0.012 * (0.4 + e.weight);
        const fx = (dx / dist) * k, fy = (dy / dist) * k;
        e.source.vx += fx; e.source.vy += fy;
        e.target.vx -= fx; e.target.vy -= fy;
      });

      nodes.forEach((n) => {
        n.vx -= n.x * 0.0016;
        n.vy -= n.y * 0.0016;
        if (n === dragging) { n.vx = 0; n.vy = 0; return; }
        n.vx *= 0.86; n.vy *= 0.86;
        n.x += Math.max(-24, Math.min(24, n.vx * alpha));
        n.y += Math.max(-24, Math.min(24, n.vy * alpha));
      });
      return true;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.save();
      ctx.translate(canvas.clientWidth / 2 + offsetX, canvas.clientHeight / 2 + offsetY);
      ctx.scale(scale, scale);

      const focusIds = selected ? neighbours.get(selected.id) : null;
      const isFocused = (n) => !selected || n.id === selected.id || focusIds.has(n.id);

      ctx.lineWidth = 1 / scale;
      edges.forEach((e) => {
        const lit = e.source.visible && e.target.visible && isFocused(e.source) && isFocused(e.target);
        ctx.strokeStyle = lit ? "rgba(91, 91, 121, " + (0.22 + e.weight * 0.45) + ")" : "rgba(188, 188, 208, 0.10)";
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        ctx.stroke();
      });

      // Detail is gated on the node's on-screen size, not on the zoom level alone, so a fitted
      // overview still labels its biggest topics while a dense field never turns into soup.
      // Labels themselves are collected here and drawn later, in drawLabels().
      const labelsEnabled = document.getElementById("label-toggle").checked;
      const labelCandidates = [];

      nodes.forEach((n) => {
        const dim = !n.visible || !isFocused(n);
        const alphaMul = dim ? 0.13 : 1;

        // Ring: the platform mix of the cluster, always drawn so the platform legend is
        // legible at any zoom. It costs one arc per platform, never one per signal.
        if (n.mix.length) {
          ctx.globalAlpha = alphaMul;
          ctx.lineWidth = ringWidth(n);
          const ringRadius = n.r + ctx.lineWidth * 0.75;
          let from = -Math.PI / 2;
          n.mix.forEach(([platform, share]) => {
            const to = from + share * Math.PI * 2;
            ctx.strokeStyle = platformColor(platform);
            ctx.beginPath();
            ctx.arc(n.x, n.y, ringRadius, from + 0.012, to - 0.012);
            ctx.stroke();
            from = to;
          });
        }

        // Dots are the signal layer: each one is a sampled signal carrying its verbatim title,
        // readable on hover. They are drawn only once the node is large enough on screen.
        if (dotsVisible(n)) {
          n.dots.forEach((dot, i) => {
            const point = dotPosition(n, i);
            ctx.globalAlpha = alphaMul * (dot === hoveredDot ? 1 : 0.7);
            ctx.fillStyle = platformColor(dot.p);
            ctx.beginPath();
            ctx.arc(point.x, point.y, dot === hoveredDot ? 3.4 : 2.1, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.globalAlpha = alphaMul;
        ctx.fillStyle = momentumColor(n.momentum);
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();

        if (n === hovered || n === selected) {
          ctx.strokeStyle = token("--color-ring");
          ctx.lineWidth = 2 / scale;
          ctx.stroke();
        }

        if (labelsEnabled && !dim && n.r * scale >= 4.5) labelCandidates.push(n);
      });

      ctx.globalAlpha = 1;
      ctx.restore();

      drawLabels(labelCandidates);
    }

    // Labels are drawn in their own screen-space pass after every node, so a circle can never
    // paint over a label, and each one claims a rectangle: a label that would collide with one
    // already placed is dropped. Zooming in spreads the nodes apart, which frees rectangles and
    // reveals more labels — instead of stacking them all on top of each other.
    const LABEL_FONT_MIN_PX = 10;
    const LABEL_FONT_MAX_PX = 18;
    const LABEL_MAX_CHARS = 34;
    const LABEL_PADDING = 3;
    const LABEL_BUDGET = 90;

    function labelFontSize(n) {
      const share = Math.min(1, n.prominence / maxProminence);
      return Math.round(LABEL_FONT_MIN_PX + (LABEL_FONT_MAX_PX - LABEL_FONT_MIN_PX) * Math.pow(share, 1.3));
    }

    function occupiedPanels() {
      const margin = 6;
      return ["toolbar", "legend", "details", "hint"].reduce((boxes, id) => {
        const el = document.getElementById(id);
        if (!el || el.style.display === "none") return boxes;
        const r = el.getBoundingClientRect();
        if (r.width && r.height) {
          boxes.push({ left: r.left - margin, right: r.right + margin, top: r.top - margin, bottom: r.bottom + margin });
        }
        return boxes;
      }, []);
    }

    function drawLabels(candidates) {
      if (!candidates.length) return;

      const priority = (n) => (n === selected ? 3 : n === hovered ? 2 : 0);
      candidates.sort((a, b) => (priority(b) - priority(a)) || (b.prominence - a.prominence));

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.lineJoin = "round";
      const halo = token("--color-background") || "#FFFFFF";
      const ink = token("--color-foreground") || "#0B0B17";
      const fontStack = token("--font-sans");

      const placed = occupiedPanels();
      let drawn = 0;
      for (const n of candidates) {
        if (drawn >= LABEL_BUDGET) break;
        const fontPx = labelFontSize(n);
        // One weight at every size: hierarchy comes from the type size, not from going bold.
        ctx.font = "500 " + fontPx + "px " + fontStack;
        const text = n.label.length > LABEL_MAX_CHARS ? n.label.slice(0, LABEL_MAX_CHARS - 1) + "…" : n.label;
        const width = ctx.measureText(text).width;
        const cx = n.x * scale + canvas.clientWidth / 2 + offsetX;
        const outerRadius = (dotsVisible(n) ? haloRadius(n) + 3 : n.r + ringWidth(n)) * scale;
        const centreY = n.y * scale + canvas.clientHeight / 2 + offsetY;
        // Below the node first, then above it: a label blocked by a neighbour or by a panel gets
        // a second chance on the other side before it is dropped.
        const options = [centreY + outerRadius + 5, centreY - outerRadius - 5 - fontPx];

        let box = null;
        for (const cy of options) {
          const candidate = {
            left: cx - width / 2 - LABEL_PADDING,
            right: cx + width / 2 + LABEL_PADDING,
            top: cy - LABEL_PADDING,
            bottom: cy + fontPx + LABEL_PADDING,
            y: cy,
          };
          if (candidate.right < 0 || candidate.left > canvas.clientWidth) break;
          if (candidate.bottom < 0 || candidate.top > canvas.clientHeight) continue;
          const collides = placed.some((p) =>
            candidate.left < p.right && candidate.right > p.left && candidate.top < p.bottom && candidate.bottom > p.top);
          if (!collides) { box = candidate; break; }
        }
        if (!box) continue;

        placed.push(box);
        drawn++;
        ctx.strokeStyle = halo;
        ctx.lineWidth = 2 + fontPx * 0.14;
        ctx.strokeText(text, cx, box.y);
        ctx.fillStyle = ink;
        ctx.fillText(text, cx, box.y);
      }
      ctx.restore();
    }

    let didFit = false;
    function fitToView(padding = 90) {
      const shown = nodes.filter((n) => n.visible);
      if (!shown.length) return;
      const xs = shown.map((n) => n.x), ys = shown.map((n) => n.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const width = Math.max(1, maxX - minX), height = Math.max(1, maxY - minY);
      scale = Math.min(2, Math.max(0.12,
        Math.min((canvas.clientWidth - padding * 2) / width, (canvas.clientHeight - padding * 2) / height)));
      offsetX = -((minX + maxX) / 2) * scale;
      offsetY = -((minY + maxY) / 2) * scale;
    }

    function frame() {
      const moved = tick();
      if (!didFit && alpha < 0.2) { fitToView(); didFit = true; }
      if (moved) draw();
      requestAnimationFrame(frame);
    }

    const ringWidth = (n) => Math.max(2.2, n.r * 0.34);
    const haloRadius = (n) => n.r + ringWidth(n) * 1.5 + 5;
    const dotsVisible = (n) => n.dots.length > 0 && n.r * scale >= 9;

    function dotPosition(n, index) {
      const halo = haloRadius(n);
      const angle = (index / n.dots.length) * Math.PI * 2 + n.r;
      return { x: n.x + Math.cos(angle) * halo, y: n.y + Math.sin(angle) * halo };
    }

    function dotAt(worldPoint) {
      // Only nodes big enough to draw their dots are tested, so this stays bounded no matter
      // how many signals the database holds.
      const radius = 6 / scale;
      for (const n of nodes) {
        if (!n.visible || !dotsVisible(n)) continue;
        const reach = n.r * 2 + 20;
        if (Math.abs(n.x - worldPoint.x) > reach || Math.abs(n.y - worldPoint.y) > reach) continue;
        for (let i = 0; i < n.dots.length; i++) {
          const point = dotPosition(n, i);
          if (Math.hypot(point.x - worldPoint.x, point.y - worldPoint.y) <= radius) {
            return { dot: n.dots[i], node: n };
          }
        }
      }
      return null;
    }

    function nodeAt(sx, sy) {
      const w = toWorld(sx, sy);
      let best = null, bestDist = Infinity;
      for (const n of nodes) {
        if (!n.visible) continue;
        const d = Math.hypot(n.x - w.x, n.y - w.y);
        if (d < n.r + 4 && d < bestDist) { best = n; bestDist = d; }
      }
      return best;
    }

    canvas.addEventListener("mousemove", (ev) => {
      pointer = { x: ev.clientX, y: ev.clientY };
      if (dragging) {
        const w = toWorld(ev.clientX, ev.clientY);
        dragging.x = w.x; dragging.y = w.y;
        alpha = Math.max(alpha, 0.35);
        return;
      }
      if (panning) {
        offsetX += ev.movementX; offsetY += ev.movementY;
        draw();
        return;
      }
      const hit = nodeAt(ev.clientX, ev.clientY);
      const dotHit = hit ? null : dotAt(toWorld(ev.clientX, ev.clientY));
      if (hit !== hovered || (dotHit && dotHit.dot) !== hoveredDot) {
        hovered = hit;
        hoveredDot = dotHit ? dotHit.dot : null;
        draw();
      }

      if (hovered || hoveredDot) {
        tooltip.style.display = "block";
        tooltip.style.left = (ev.clientX + 14) + "px";
        tooltip.style.top = (ev.clientY + 14) + "px";
        tooltip.innerHTML = "";
        if (hoveredDot) {
          tooltip.append(hoveredDot.t);
          const meta = document.createElement("b");
          meta.textContent = hoveredDot.p + " · signal";
          tooltip.append(document.createElement("br"), meta);
        } else {
          tooltip.append(hovered.label);
          const stats = document.createElement("b");
          stats.textContent = hovered.score + " · " + hovered.signal_count + " signals · " + hovered.momentum;
          tooltip.append(document.createElement("br"), stats);
        }
      } else {
        tooltip.style.display = "none";
      }
    });

    canvas.addEventListener("mousedown", (ev) => {
      const hit = nodeAt(ev.clientX, ev.clientY);
      if (hit) { dragging = hit; } else { panning = true; canvas.classList.add("dragging"); }
    });
    window.addEventListener("mouseup", () => { dragging = null; panning = false; canvas.classList.remove("dragging"); });

    canvas.addEventListener("click", (ev) => {
      const hit = nodeAt(ev.clientX, ev.clientY);
      selected = hit && hit === selected ? null : hit;
      renderDetails();
      draw();
    });

    // A trackpad fires many small wheel events where a mouse fires a few large ones, so a fixed
    // step per event compounds into an uncontrollable zoom while a purely proportional one crawls.
    // Zoom scales with the real delta, gains a linear acceleration while the user keeps swiping,
    // and is hard-capped per event so no single flick can throw the view across the scale range.
    const ZOOM_BASE = 0.0045;          // exponent per pixel of wheel delta
    const ZOOM_ACCEL_MAX = 2.4;        // fastest sustained swipe counts this much more per pixel
    const ZOOM_ACCEL_RAMP = 260;       // pixels of recent travel needed to reach the top of the ramp
    const PINCH_MULTIPLIER = 2.2;      // ctrl+wheel is a trackpad pinch, which expects a bigger step
    const MAX_STEP = 0.35;             // ceiling per event: at most about 1.42x in one go
    const ACCEL_WINDOW_MS = 150;
    let recentTravel = 0;
    let lastWheelAt = 0;

    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const pixels = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaMode === 2 ? ev.deltaY * 400 : ev.deltaY;

      const now = performance.now();
      if (now - lastWheelAt > ACCEL_WINDOW_MS) recentTravel = 0;
      lastWheelAt = now;
      recentTravel = recentTravel * 0.8 + Math.abs(pixels);
      const accel = 1 + Math.min(ZOOM_ACCEL_MAX - 1, recentTravel / ZOOM_ACCEL_RAMP);

      const raw = pixels * ZOOM_BASE * accel * (ev.ctrlKey ? PINCH_MULTIPLIER : 1);
      const step = Math.max(-MAX_STEP, Math.min(MAX_STEP, raw));

      const before = toWorld(ev.clientX, ev.clientY);
      scale = Math.min(4, Math.max(0.12, scale * Math.exp(-step)));
      const after = toWorld(ev.clientX, ev.clientY);
      offsetX += (after.x - before.x) * scale;
      offsetY += (after.y - before.y) * scale;
      draw();
    }, { passive: false });

    function renderDetails() {
      const panel = document.getElementById("details");
      if (!selected) { panel.style.display = "none"; return; }
      panel.style.display = "block";
      document.getElementById("d-title").textContent = selected.label;
      document.getElementById("d-full-title").textContent = selected.full_title || "";
      document.getElementById("d-meta").textContent =
        selected.momentum.toUpperCase() + " · score " + selected.score +
        " · " + selected.category + " · " + selected.signal_count + " signals";
      document.getElementById("d-summary").textContent = selected.summary || "";

      const holder = document.getElementById("d-platforms");
      holder.innerHTML = "";
      const total = Math.max(1, selected.signal_count);
      Object.entries(selected.platforms).sort((a, b) => b[1] - a[1]).forEach(([platform, count]) => {
        const row = document.createElement("div");
        row.className = "bar-row";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = platform;
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("span");
        fill.style.width = Math.round((count / total) * 100) + "%";
        fill.style.background = platformColor(platform);
        bar.appendChild(fill);
        const value = document.createElement("b");
        value.textContent = count;
        row.append(name, bar, value);
        holder.appendChild(row);
      });
    }
    document.getElementById("details-close").addEventListener("click", () => { selected = null; renderDetails(); draw(); });

    // --- Filters: matching nodes stay in place and dim, so the layout never jumps under the user.
    const searchInput = document.getElementById("search");
    const categoryFilter = document.getElementById("category-filter");
    const platformFilter = document.getElementById("platform-filter");
    const momentumFilter = document.getElementById("momentum-filter");
    const scoreFilter = document.getElementById("score-filter");

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      const plat = platformFilter.value;
      const mom = momentumFilter.value;
      const minScore = Number(scoreFilter.value);
      document.getElementById("score-value").textContent = minScore;

      let shown = 0;
      nodes.forEach((n) => {
        n.visible = (!q || n.label.toLowerCase().includes(q) || (n.full_title || "").toLowerCase().includes(q))
          && (!cat || n.category === cat)
          && (!plat || Object.prototype.hasOwnProperty.call(n.platforms, plat))
          && (!mom || n.momentum.toLowerCase() === mom)
          && n.score >= minScore;
        if (n.visible) shown++;
      });
      document.getElementById("count-chip").textContent = shown + " / " + nodes.length + " topics";
      draw();
    }
    [searchInput, categoryFilter, platformFilter, momentumFilter, scoreFilter]
      .forEach((el) => el.addEventListener("input", applyFilters));

    document.getElementById("label-toggle").addEventListener("change", draw);
    document.getElementById("reset").addEventListener("click", () => {
      selected = null;
      searchInput.value = ""; categoryFilter.value = ""; platformFilter.value = "";
      momentumFilter.value = ""; scoreFilter.value = 0;
      renderDetails(); applyFilters(); fitToView(); draw();
    });

    function bootstrapControls() {
      document.getElementById("geo-chip").textContent = GRAPH.geo + " · " + GRAPH.generated_at;
      const categories = [...new Set(nodes.map((n) => n.category))].sort();
      const platforms = [...new Set(nodes.flatMap((n) => Object.keys(n.platforms)))].sort();
      const momentums = [...new Set(nodes.map((n) => n.momentum.toLowerCase()))].sort();
      const fill = (select, values) => values.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v; opt.textContent = v;
        select.appendChild(opt);
      });
      fill(categoryFilter, categories);
      fill(platformFilter, platforms);
      fill(momentumFilter, momentums);

      const rows = document.getElementById("legend-rows");
      const section = (title, caption) => {
        const heading = document.createElement("div");
        heading.className = "title";
        heading.style.marginTop = rows.childElementCount ? "12px" : "0";
        heading.textContent = title;
        const sub = document.createElement("div");
        sub.className = "caption";
        sub.textContent = caption;
        rows.append(heading, sub);
      };
      const swatchRow = (label, style) => {
        const row = document.createElement("div");
        row.className = "row";
        const swatch = document.createElement("span");
        Object.assign(swatch, style.attrs);
        Object.assign(swatch.style, style.css);
        row.append(swatch, document.createTextNode(label));
        rows.appendChild(row);
      };

      section("Momentum", "node fill");
      momentums.forEach((m) => swatchRow(m, { attrs: { className: "dot" }, css: { background: momentumColor(m) } }));
      section("Platform", "ring around the node");
      platforms.forEach((p) => swatchRow(p, { attrs: { className: "ring" }, css: { borderColor: platformColor(p) } }));
    }

    resize();
    bootstrapControls();
    applyFilters();
    frame();
  </script>
</body>
</html>
