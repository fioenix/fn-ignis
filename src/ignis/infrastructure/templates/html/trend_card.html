<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ cluster.canonical_name }} - Trend Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8 antialiased flex items-center justify-center">
  <div class="max-w-2xl w-full bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm space-y-6">
    <div class="flex justify-between items-start border-b border-slate-100 pb-4">
      <div class="space-y-1">
        <span class="bg-orange-100 text-orange-800 text-xs px-2.5 py-0.5 rounded-full font-extrabold uppercase">🔥 TOPIC INTEL</span>
        <h1 class="text-xl md:text-2xl font-black text-slate-900 mt-1">{{ cluster.canonical_name }}</h1>
      </div>
      <span class="text-xs font-mono font-bold bg-slate-100 text-slate-600 px-3 py-1 rounded-full">
        Momentum: {{ cluster.cross_platform_score|round(1) }}
      </span>
    </div>

    <p class="text-sm text-slate-600 leading-relaxed font-normal">{{ cluster.summary_text }}</p>

    <div class="space-y-3 pt-2">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Supporting Signal Stream ({{ signals|length }})</h3>
      <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
        {% for s in signals %}
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 flex justify-between items-center text-xs">
          <span class="font-semibold text-slate-800 truncate pr-2">{{ s.raw_title }}</span>
          <span class="font-mono text-orange-600 font-bold shrink-0">{{ s.metric_value|int }}</span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</body>
</html>
