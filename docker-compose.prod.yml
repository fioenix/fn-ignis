services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: fn-ignis-db

    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ignis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ignis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reports:
    image: nginx:1.27-alpine
    container_name: fn-ignis-reports
    restart: unless-stopped
    ports:
      - "${REPORTS_PORT:-53080}:80"
    volumes:
      - reports_data:/usr/share/nginx/html:ro

volumes:
  pgdata:
  reports_data:
