[project]
name = "fn-ignis"
version = "0.5.0"
description = "fnIgnis — Unified Self-Hosted Autonomous Trend Intelligence & Market Opportunity Platform with FastMCP Server"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "FINOLABS", email = "fioenix@finolabs.io" }
]
keywords = [
    "trend-intelligence",
    "mcp",
    "fastmcp",
    "market-research",
    "social-listening",
    "white-space-analysis",
    "tiktok-creative-center",
    "voice-of-customer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0,<3.0.0",
    "fastmcp>=0.4.0,<5.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "google-api-python-client>=2.150.0",
    "jinja2>=3.1.5",
    "cryptography>=43.0.0",
    "cachetools>=5.5.0",
]

[project.scripts]
fn-ignis = "ignis.interfaces.mcp.server:main"
fn-ignis-worker = "ignis.interfaces.cli.scheduler:main"
ignis-mcp = "ignis.interfaces.mcp.server:main"
ignis-worker = "ignis.interfaces.cli.scheduler:main"
ignis-setup = "ignis.interfaces.cli.setup_bundle:main"


[project.optional-dependencies]
ai = [
    "sentence-transformers>=3.4.0",
    "pgvector>=0.3.6",
]
browser = [
    "playwright>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "playwright>=1.50.0",
    "ruff>=0.8.0",
]



[project.urls]
Homepage = "https://github.com/fioenix/fn-ignis"
Repository = "https://github.com/fioenix/fn-ignis"
Issues = "https://github.com/fioenix/fn-ignis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignis"]

# The SQL seeds live at the repository root, where the bootstrap script and the Postgres
# migration flow read them. A wheel cannot reach outside the package, so ship a copy inside it;
# ignis.resources resolves whichever layout is present at runtime.
[tool.hatch.build.targets.wheel.force-include]
"sql" = "ignis/sql"

[tool.hatch.build.targets.sdist]
exclude = [
    ".specify",
    ".pytest_cache",
    ".ruff_cache",
    ".agents",
    "BACKLOG.md",
    "backlog.local.md",
    "specs",
    "/reports",
]


[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-v"
# The repository root, so tests can import the maintenance tools under scripts/. The package
# itself is installed from src/ and is unaffected.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293", "W291", "W292", "E741"]

