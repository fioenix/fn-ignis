[project]
name = "fn-ignis"
version = "0.1.0"
description = "Unified Self-Hosted Trend Intelligence & Social Listening Platform with FastMCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "fastmcp>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "google-api-python-client>=2.150.0",
    "jinja2>=3.1.5",
]

[project.optional-dependencies]
ai = [
    "sentence-transformers>=3.4.0",
    "pgvector>=0.3.6",
]
browser = [
    "playwright>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignis"]
